<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/a9397ecdef.js" crossorigin="anonymous"></script>
    <title>Before you leave...</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Azeret+Mono:ital,wght@0,100..900;1,100..900&family=Bentham&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Micro+5&family=Nothing+You+Could+Do&family=Pangolin&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Reenie+Beanie&family=Rethink+Sans:ital,wght@0,400..800;1,400..800&family=Schoolbell&family=Shadows+Into+Light&family=Silkscreen:wght@400;700&family=Single+Day&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            position: relative;
            margin-top: 0px;
            padding: 10px;
            margin-bottom: 30px;
            width: auto;
            max-width: 50%;
            white-space: normal;
            background-color: rgb(37, 74, 194);
        }
        .typewriter p {
            overflow-x: hidden; 
            white-space: nowrap;
            border-right: .15em solid rgb(255, 255, 255); 
            display: inline-block;
            word-break: break-word;
            margin: 0 auto;
            animation: 
            typing 5s steps(29, end),
            blink-caret .8s step-end infinite;
            font-size: 12pt;
            font-style: italic;
            color: rgb(255, 255, 255);
            max-width: 100%;
            font-family: "Alice", serif;
            font-size: 24pt;
        }
        /* The typing effect */
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        p:hover {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
        }
        .restart-container {
            position: fixed;
            bottom: 40px;
            width: 100%;
            text-align: right;
            right: 40px;
        }

        .restart-container a {
            color: white;
        }
    </style>
    <body>
        <div class="container">
            <div class="typewriter">
                <p><span onclick="window.location.href='end4.html'">And it's all so quiet.&nbsp;.&nbsp;.</span></p>
            </div>
        </div>
        <div class="restart-container">
            <a href="index.html" style="text-decoration: none;">
              <i class="fa fa-repeat" aria-hidden="true"></i>&nbsp;restart game&nbsp;
            </a>
          </div>
    </body>
